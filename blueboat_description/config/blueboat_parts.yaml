# BlueBoat, assembled from bluerobotics_parts. PROTOTYPE of the parts driven
# configuration; blueboat.yaml (accessories on a hand written hull) is still
# what the package builds.
#
# base:  the part whose link is the assembly root, in the chassis frame
#        delivered by the modeler (origin at the mesh centroid, x forward,
#        y left, z up). collision: false because displacement and contact
#        for a surface vessel are declared below (AUR_BUOYANCY_DESIGN.md),
#        not taken from the chassis collision primitives (cylinders, which
#        graded buoyancy cannot use).
# parts: one instance each. mount: names a socket on the parent (see
#        bluerobotics_parts/urdf/mounts.yaml); xyz/rpy is an explicit pose
#        instead. parent defaults to the base link. joint: continuous for
#        parts that spin, about the axis the part declares.

base: {type: blueboat_chassis, name: base_link, collision: false}

parts:
  - {type: m200_weedless_prop_ccw, name: prop_port, mount: motor_port, joint: continuous}
  - {type: m200_weedless_prop_cw,  name: prop_stbd, mount: motor_stbd, joint: continuous}
  - {type: blueboat_antenna_mast,  name: mast,      mount: mast_socket}
  - {type: blueboat_flag,          name: flag,      mount: flag_socket}
  - {type: blueboat_payload_bracket, name: payload_bracket, mount: payload}
  - {type: blueboat_ping_singlebeam_mount, name: ping_mount, mount: ping_mount}
  - {type: ping_singlebeam,        name: ping,      parent: ping_mount, mount: sensor}

# Hull displacement, declared at the assembly (USV case): box pontoons that
# both displace water under graded buoyancy and provide contact. Sized from
# the chassis collision cylinders (r 0.092, l 1.05, at y +-0.361, z 0.059)
# and split into segments so a pitched waterplane is modeled per segment.
hull_displacement:
  length: 1.05
  width: 0.18
  height: 0.18
  x: 0.027
  y: 0.361
  z: 0.059
  segments: 6
