name: CI

on:
  push:
    branches: [lyrical]
  pull_request:

jobs:
  build:
    # Fail fast if an apt/rosdep mirror hangs instead of erroring; normal runs
    # finish in a few minutes.
    timeout-minutes: 30
    # The prebuilt ros-base image ships colcon, rosdep and vcstool, replacing a
    # from-scratch ROS install on every run; rosdep then only adds the deltas
    # (ros_gz, gz vendor packages, test deps). Build/test are explicit steps
    # (not action-ros-ci, whose pinned releases hardcode a distro whitelist
    # that lags new ROS releases).
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base
    defaults:
      run:
        shell: bash
    steps:
      # Make apt fail-and-retry instead of hanging when a mirror wedges
      # (packages.ros.org flakiness otherwise stalls rosdep).
      - name: Harden apt against hung mirrors
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            > /etc/apt/apt.conf.d/80-network-hardening
      - uses: actions/checkout@v7
        with:
          path: src/bluerobotics_models
      # gz_thruster is an unreleased sibling package, so rosdep cannot resolve
      # it. Only that one package is copied in: importing all of gz-maritime
      # would pull in gz_waves_provider_fft, whose ehukai dependency has no
      # rosdep key either. Temporary, until the plugin change reaches gz-sim.
      - name: Fetch unreleased sources
        run: |
          mkdir -p /tmp/deps
          vcs import /tmp/deps < src/bluerobotics_models/thruster.repos
          cp -r /tmp/deps/gz-maritime/gz_thruster src/gz_thruster
      - name: Install dependencies
        run: |
          apt-get update
          # The headless EGL render path is an explicit contract, not a
          # transitive accident of the gz dependency graph.
          apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgl1-mesa-dri libglvnd0 mesa-utils
          rosdep update
          rosdep install --from-paths src -y --ignore-src
      - name: Build
        run: |
          source /opt/ros/lyrical/setup.bash
          # merge-install is the project standard layout (see the README).
          colcon build --merge-install --event-handlers console_cohesion+
      # The two simulator-driven suites are skipped here for now (#69). They
      # start a real Gazebo and assert physical behavior - speeds, distances,
      # a live ROS graph - so they move with every hydrodynamic coefficient
      # while the vehicle model is being identified, and they are the ones
      # that broke on an upstream image skew. They still run locally in
      # drydock; they return to CI once the model settles and their
      # thresholds can be derived from it rather than tuned by hand.
      - name: Test
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon test --merge-install --event-handlers console_cohesion+ \
            --ctest-args -E "test_(gz|ros)_launch"
          colcon test-result --verbose
      # Full colcon logs (per-test stdout included) for auditing, pass or fail.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: log/
