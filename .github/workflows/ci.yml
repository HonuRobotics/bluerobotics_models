name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # The prebuilt ros-base image ships colcon, rosdep and vcstool, replacing a
    # from-scratch ROS install on every run; rosdep then only adds the deltas
    # (ros_gz, gz vendor packages, test deps). Build/test are explicit steps
    # (not action-ros-ci, whose pinned releases hardcode a distro whitelist
    # that lags new ROS releases).
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/bluerov2
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src -y --ignore-src
      # console_direct+ streams every subprocess's stdout/stderr straight to the
      # job log as it happens, and --log-level info makes colcon print the exact
      # command it invokes for each package, so the run is auditable in the
      # Actions UI without downloading the artifact.
      - name: Build
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon --log-level info build --event-handlers console_direct+
      - name: Test
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon --log-level info test --event-handlers console_direct+
          colcon test-result --verbose --all
      # Full colcon logs (per-test stdout included) for auditing, pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: log/
