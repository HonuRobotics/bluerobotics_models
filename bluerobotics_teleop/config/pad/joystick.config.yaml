# Shipped default teleop_twist_joy mapping, shared by every vehicle (a
# vehicle without a motion, like the boat's sway or heave, zeroes it in
# its mixer gains). `ros2 run bluerobotics_teleop joy_map` writes a user
# mapping under $ROS_HOME which the teleop launch prefers over this file.
# Left stick: surge + yaw. Right stick: sway + heave. RB: deadman.
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 2
      z: 3
    scale_linear:
      x: 1.0
      y: 1.0
      z: -1.0
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 1.0
    enable_button: 5
    enable_turbo_button: -1
