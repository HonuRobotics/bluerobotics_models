# teleop_twist_joy mapping, generated for the connected pad. Shared by
# every vehicle: a vehicle without a motion (the boat has no sway or
# heave) zeroes it in its mixer gains instead.
# Left stick: surge + yaw. Right stick: sway + heave. RB: deadman.
# Regenerate with: ros2 run bluerobotics_teleop joy_map
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 2
      z: 3
    scale_linear:
      x: 1.0
      y: 1.0
      z: -1.0
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 1.0
    enable_button: 5
    enable_turbo_button: -1
