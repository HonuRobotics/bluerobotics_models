# Shipped default input side settings for twist_to_thrust, shared by
# every vehicle (joy_map writes a user copy under $ROS_HOME which the
# launch prefers; the per vehicle mixer.yaml is model truth).
twist_to_thrust:
  ros__parameters:
    cmd_timeout_sec: 0.5
    btn_deadman: 5
    axis_epa: 5
    epa_initial: 0.2
    epa_step: 0.1
