# teleop_twist_joy mapping (Xbox style pad, joy_node linux layout).
# Left stick: surge + yaw. RB: deadman.
# Regenerate with: ros2 run bluerobotics_teleop joy_calibrate --vehicle blueboat
teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 1.0
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 1.0
    enable_button: 5
    enable_turbo_button: -1
