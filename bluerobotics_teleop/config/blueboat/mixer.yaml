# BlueBoat differential mixer: model truth, not user preference. Port rides
# at +y, so a positive yaw (turn left, REP 103) is starboard forward and
# port reverse.
twist_to_thrust:
  ros__parameters:
    # Relative to the instance: the teleop launch runs the mixer in the
    # /<name> namespace, so these resolve to /<name>/motor_port/cmd and so on.
    thruster_topics:
      - motor_port/cmd
      - motor_stbd/cmd
    gains_linear_x:  [ 1.0,  1.0]
    gains_linear_y:  [ 0.0,  0.0]
    gains_linear_z:  [ 0.0,  0.0]
    gains_angular_z: [-1.0,  1.0]
    # The BlueBoat's thruster takes a normalized command, so the envelope is
    # unity: the limits themselves live in the model, declared once, and the
    # mixer no longer carries a second copy of them to drift from.
    max_thrust_forward: 1.0
    max_thrust_reverse: -1.0
